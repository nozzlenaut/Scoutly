name: PriceSift Video Draft

on:
  push:
    branches:
      - codex/a770-short-pilot
    paths:
      - "video-generator/**"
      - ".github/workflows/a770-short-pilot.yml"
  schedule:
    # GitHub cron is UTC. Two runs plus an America/Detroit hour gate keep this at 9 AM through DST changes.
    - cron: "10 13 * * *"
    - cron: "10 14 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "Render the deterministic A770 fixture instead of using live PriceSift/Buffer data"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  PRICESIFT_BASE_URL: ${{ secrets.PRICESIFT_BASE_URL }}
  PRICESIFT_ADMIN_TOKEN: ${{ secrets.PRICESIFT_ADMIN_TOKEN }}
  BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
  BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
  BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.PRICESIFT_R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.PRICESIFT_R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.PRICESIFT_R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.PRICESIFT_R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.PRICESIFT_R2_PUBLIC_BASE_URL }}

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Choose fixture, live, or skip mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mode="skip"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            mode="fixture"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.fixture }}" == "true" ]]; then
            mode="fixture"
          else
            if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              local_hour=$(TZ=America/Detroit date +%H)
              if [[ "$local_hour" != "09" ]]; then
                echo "Skipping duplicate DST cron. Local hour is $local_hour."
                echo "mode=skip" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            required=(PRICESIFT_BASE_URL PRICESIFT_ADMIN_TOKEN BUFFER_API_KEY BUFFER_ORGANIZATION_ID BUFFER_YOUTUBE_CHANNEL_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT R2_BUCKET R2_PUBLIC_BASE_URL)
            missing=()
            for name in "${required[@]}"; do
              if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
            done
            if (( ${#missing[@]} > 0 )); then
              echo "Live video automation is not configured yet. Missing: ${missing[*]}"
              mode="skip"
            else
              mode="live"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "PriceSift video mode: $mode"

      - name: Set up Node.js
        if: steps.mode.outputs.mode != 'skip'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video-generator/package.json

      - name: Set up Python
        if: steps.mode.outputs.mode != 'skip'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run selector tests
        if: steps.mode.outputs.mode != 'skip'
        working-directory: video-generator
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prepare story
        if: steps.mode.outputs.mode != 'skip'
        working-directory: video-generator
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.mode.outputs.mode }}" == "fixture" ]]; then
            python scripts/prepare_story.py --fixture fixtures/a770-signals.json
          else
            python scripts/prepare_story.py
          fi

      - name: Read selection decision
        if: steps.mode.outputs.mode != 'skip'
        id: decision
        working-directory: video-generator
        shell: bash
        run: |
          selected=$(python -c 'import json; print(str(json.load(open("work/decision.json"))["selected"]).lower())')
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          cat work/decision.json

      - name: Stop cleanly when nothing is noteworthy
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected != 'true'
        run: echo "No noteworthy, eligible, non-repetitive PriceSift story today. No video created."

      - name: Install system audio tools
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install narration and media dependencies
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        run: python -m pip install --upgrade pip && pip install "kokoro==0.9.4" "soundfile==0.13.1" "boto3>=1.34,<2"

      - name: Install Remotion dependencies
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        run: npm install

      - name: Generate natural narration and exact scene timings
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        run: python scripts/generate_voice.py

      - name: Typecheck video template
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        run: npm run typecheck

      - name: Render vertical Short
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        run: npm run render

      - name: Validate rendered media
        if: steps.mode.outputs.mode != 'skip' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        shell: bash
        run: |
          set -euo pipefail
          file="out/pricesift-short.mp4"
          test -s "$file"
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 "$file" | tr -cd '0-9')
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 "$file" | tr -cd '0-9')
          audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$file" | tr -d '\r\n, ')
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file" | tr -cd '0-9.')
          echo "render: ${width}x${height}, audio=${audio}, duration=${duration}s"
          test "$width" = "1080"
          test "$height" = "1920"
          test -n "$audio"
          awk -v d="$duration" 'BEGIN { exit !(d >= 20 && d <= 60) }'

      - name: Upload fixture artifact for review
        if: steps.mode.outputs.mode == 'fixture' && steps.decision.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pricesift-short-fixture
          path: |
            video-generator/out/pricesift-short.mp4
            video-generator/work/story.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload live Short to Cloudflare R2
        if: steps.mode.outputs.mode == 'live' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        run: python scripts/upload_r2.py

      - name: Create pre-scheduled Buffer YouTube draft
        if: steps.mode.outputs.mode == 'live' && steps.decision.outputs.selected == 'true'
        working-directory: video-generator
        shell: bash
        run: |
          set -euo pipefail
          public_url=$(cat work/public-url.txt)
          python scripts/create_buffer_draft.py "$public_url"

      - name: Upload live pipeline receipt
        if: steps.mode.outputs.mode == 'live' && steps.decision.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pricesift-video-receipt
          path: |
            video-generator/work/decision.json
            video-generator/work/story.json
            video-generator/work/buffer-receipt.json
          if-no-files-found: error
          retention-days: 30
