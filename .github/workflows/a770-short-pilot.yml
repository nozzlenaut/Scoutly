name: A770 Short Pilot

on:
  push:
    branches:
      - codex/a770-short-pilot
    paths:
      - "video-generator/**"
      - ".github/workflows/a770-short-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video-generator/package.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg

      - name: Install Kokoro narration dependencies
        run: python -m pip install --upgrade pip && pip install "kokoro==0.9.4" "soundfile==0.13.1"

      - name: Install Remotion dependencies
        working-directory: video-generator
        run: npm install

      - name: Generate natural narration and exact scene timings
        working-directory: video-generator
        run: python scripts/generate_voice.py

      - name: Render vertical Short
        working-directory: video-generator
        run: npm run render:a770

      - name: Validate rendered media
        working-directory: video-generator
        shell: bash
        run: |
          set -euo pipefail
          file="out/a770-price-spike-short.mp4"
          test -s "$file"
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")
          audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file")
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")
          echo "render: ${width}x${height}, audio=${audio}, duration=${duration}s"
          test "$width" = "1080"
          test "$height" = "1920"
          test -n "$audio"
          awk -v d="$duration" 'BEGIN { exit !(d >= 25 && d <= 60) }'

      - name: Upload pilot video
        uses: actions/upload-artifact@v4
        with:
          name: pricesift-a770-short-pilot
          path: |
            video-generator/out/a770-price-spike-short.mp4
            video-generator/public/audio/*.wav
          if-no-files-found: error
          retention-days: 14
