name: Price Index Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-extra-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        id: typecheck
        continue-on-error: true
        run: |
          set +e
          npx tsc --noEmit > ../typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit $status
      - name: Upload typecheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log
      - name: Fail on typecheck error
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
      - name: Lint frontend
        run: npm run lint
