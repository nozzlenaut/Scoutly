name: Price Index Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-extra-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Lint frontend
        run: npm run lint
